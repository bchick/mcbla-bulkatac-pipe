# nf-core/atacseq 2.1.2 on the synthetic .test dataset (see run_nfcore.sh).
# Inputs and references are passed on the command line as absolute paths.
# Settings match the .test config where both pipelines have one.
aligner: bowtie2
macs_gsize: 4000000   # .test config macs2_gsize
read_length: 50       # simulate_atac.py READ_LEN
mito_name: chrM
narrow_peak: true     # our MACS2 calls are narrow
igenomes_ignore: true
skip_preseq: true     # too few reads for a complexity curve
skip_igv: true
