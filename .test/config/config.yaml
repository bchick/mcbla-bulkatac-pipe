# =============================================================================
# .test configuration: tiny synthetic ATAC dataset (see .test/README.md)
# Run from the repo root:  pixi run test   (align -> peaks -> IDR)
# This directory is the Snakemake working directory (--directory .test).
# =============================================================================
# -----------------------------------------------------------------------------
# Inputs
# -----------------------------------------------------------------------------
# Samplesheet (TSV or CSV). nf-core/atacseq compatible columns
#   sample, fastq_1, fastq_2, replicate
# plus
#   condition  (grouping used for merging, IDR, contrasts; defaults to sample)
#   treatment  (optional; time-course series, e.g. egf / hrg / unstim)
#   time       (optional; numeric time point, e.g. minutes)
# Each library is named <sample>_REP<replicate>, exactly as nf-core does.
# Rows sharing sample + replicate are runs of one library and are concatenated.
samples: config/samples.tsv

# Contrasts for the diff and normcheck modules: group1, group2, label
# (log2 fold change = group1 over group2).
contrasts: config/contrasts.tsv

# fastq  : full pipeline from FASTQ (trim, align, filter, dedup, ...).
# nfcore : start from an nf-core/atacseq (2.x) outdir; alignment and
#          filtering are skipped and the filtered merged-library BAMs
#          <aligner>/merged_library/<sample>_REP<n>.mLb.clN.sorted.bam are used.
input_mode: fastq

# Prefix for relative fastq_1/fastq_2 paths in the samplesheet ("" = none).
fastq_dir: data/fastq

nfcore:
  # nf-core/atacseq --outdir
  outdir: ""
  # auto | bowtie2 | bwa | chromap | star  (auto = first <aligner>/merged_library found)
  aligner: auto
  # Use <aligner>/merged_replicate/<sample>.mRp.clN.sorted.bam as the
  # per-condition merged BAM (only when a condition is exactly one nf-core
  # `sample`). false = merge the mLb BAMs with samtools, as in FASTQ mode.
  use_merged_replicate: false

# -----------------------------------------------------------------------------
# Reference
# -----------------------------------------------------------------------------
reference:
  # Genome FASTA (plain or .gz). Linked/indexed into results/reference/.
  fasta: data/ref/genome.fa
  # bowtie2 index prefix. Empty = build one from `fasta` (fastq mode only).
  bowtie2_index: ""   # built by the pipeline from fasta
  # GTF used for the TSS enrichment profile.
  gtf: data/ref/genes.gtf
  # Blacklist BED (ENCODE v2 for hg38/mm10). Empty string disables blacklist
  # filtering everywhere (reads, peaks, TOBIAS), e.g. for rn6.
  blacklist: data/ref/blacklist.bed
  # Effective genome size for deepTools RPGC (GRCh38: 2913022398).
  effective_genome_size: 4000000
  # MACS2 -g: hs | mm | ce | dm or a number (rn6: 2375372135).
  macs2_gsize: 4000000
  # Mitochondrial contig name removed after alignment.
  mito_chrom: chrM

# Conditions left out of count-based statistics (diff, normcheck, timecourse,
# chromvar). Peaks, IDR and QC still use every condition; footprinting uses
# footprint.conditions.
# AS28 excludes the 15 min libraries (a technical batch), see salk_example.yaml.
exclude_conditions: []

# -----------------------------------------------------------------------------
# Processing modules (true/false)
# -----------------------------------------------------------------------------
modules:
  qc: true          # deepTools bigWigs, TSS profile, fragment sizes, correlation, PCA, fingerprint
  multiqc: true     # MultiQC report
  idr: true         # IDR per condition + IDR consensus peak set

# -----------------------------------------------------------------------------
# Trimming (cutadapt)
# -----------------------------------------------------------------------------
trimming:
  adapter_r1: CTGTCTCTTATACACATCT   # Nextera
  adapter_r2: CTGTCTCTTATACACATCT
  quality: "20,20"                  # -q
  min_length: 30                    # -m ; --pair-filter=any is always used
  extra: ""

# -----------------------------------------------------------------------------
# Alignment + filtering (bowtie2, samtools)
# -----------------------------------------------------------------------------
align:
  maxins: 2000            # bowtie2 --maxins (plus --no-mixed --no-discordant)
  min_mapq: 30            # samtools view -q
  flag_exclude: 2828      # samtools view -F (unmapped, mate unmapped, secondary, QC fail, supplementary); -f 2 always
  bowtie2_extra: ""
  sort_mem_per_thread: 768M

# -----------------------------------------------------------------------------
# QC (deepTools)
# -----------------------------------------------------------------------------
qc:
  bigwig_bin_size: 10     # bamCoverage --binSize, RPGC normalization
  tss_flank: 2000         # computeMatrix reference-point -a/-b
  summary_bin_size: 500   # multiBamSummary bins
  bamcoverage_extra: ""

# -----------------------------------------------------------------------------
# Peak calling (MACS2 -f BAMPE --keep-dup all)
# -----------------------------------------------------------------------------
peaks:
  relaxed_pvalue: 0.01    # per-replicate and merged "oracle" peaks (IDR input)
  stringent_qvalue: 0.05  # merged production peaks
  macs2_extra: ""

# -----------------------------------------------------------------------------
# IDR
# -----------------------------------------------------------------------------
idr:
  threshold: 0.05         # --idr-threshold; also filters column 5 >= int(-125*log2(t)) (540)
  rank: p.value
  # >2 replicates: encode_max_pair = IDR on every replicate pair, keep the pair
  # with most reproducible peaks (ENCODE "conservative" set); first_two = rep1 vs rep2.
  multi_rep_strategy: encode_max_pair
  # 1 replicate: stringent = use merged -q 0.05 peaks in the consensus; skip = leave out.
  single_rep_fallback: stringent
  # true: a failed IDR pair is recorded as FAILED in idr_summary.tsv (as in the
  # source script) instead of stopping the run.
  allow_failure: true

counts:
  # featureCounts width filter for the timecourse / chromvar peak sets
  min_width: 50           # peaks outside [min_width, max_width] are not counted
  max_width: 5000

# -----------------------------------------------------------------------------
# Analyses (opt-in)
# -----------------------------------------------------------------------------
# By default the pipeline only processes the data: BAMs, bigWigs, QC, peaks,
# IDR and the consensus peak sets. Each analysis below runs only with
# `run: true`, and then must say which peak set it uses (`peaks:`):
#   idr_consensus    results/peaks/consensus/consensus_idr.bed
#                    (merge of IDR-reproducible peaks per condition)
#   stringent_union  results/peaks/consensus/union_stringent.bed
#                    (merge of merged-BAM -q 0.05 peaks per condition)
#   individual       diff only: DiffBind consensus of per-replicate relaxed
#                    peaks present in >= diff.min_overlap libraries
#   <path>.bed       any BED file (first three columns), e.g. a curated set
# Processing outputs are reused, so switching an analysis on later and
# re-running only computes that analysis.

# -----------------------------------------------------------------------------
# Differential accessibility (DiffBind, DESeq2 backend)
# -----------------------------------------------------------------------------
diff:
  run: true
  # AS28 used individual (DiffBind's own consensus with minOverlap).
  peaks: individual
  min_overlap: 2
  # dba.count summits (re-centring width). null = DiffBind default.
  summits: null
  fdr: 0.05
  lfc: 1.0                # reported as extra |log2FC| columns; not used for FDR calls
  tissue: NA              # DiffBind "Tissue" column

# -----------------------------------------------------------------------------
# Normalization sensitivity check
# -----------------------------------------------------------------------------
normcheck:
  run: true             # needs diff.run; reuses its counted DBA and peak set
  methods: [csaw, quantile]   # csaw = background bins (DBA_NORM_NATIVE, background=TRUE); quantile = QN + limma
  sensitivity_threshold: 0.20 # flag if gained or lost changes by > 20% vs default normalization
  min_abs_change: 10          # ... and by at least this many peaks

# -----------------------------------------------------------------------------
# Time course (DESeq2 LRT + DEGreport degPatterns)
# -----------------------------------------------------------------------------
timecourse:
  run: true             # needs complete treatment + time columns
  # AS28 used idr_consensus.
  peaks: idr_consensus
  # Treatments that are a shared baseline included in every series (time 0).
  baseline_treatments: [ctrl]
  min_mean_counts: 10
  lrt_padj: 0.01
  vst_range: 0.5          # max - min of per-time VST means
  minc: 5                 # degPatterns minimum cluster size
  cutoff: 0.5             # degPatterns cluster tree cutoff
  seed: 42

# -----------------------------------------------------------------------------
# chromVAR
# -----------------------------------------------------------------------------
chromvar:
  run: true
  # AS28 used idr_consensus.
  peaks: idr_consensus
  # BSgenome package for GC bias and motif matching (e.g.
  # BSgenome.Hsapiens.UCSC.hg38). Empty = use reference.fasta via Rsamtools::FaFile.
  bsgenome: ""
  # Conda env for the chromvar rule (path relative to workflow/rules/).
  # Set to ../envs/r_bsgenome_hg38.yaml together with the bsgenome above.
  conda_env: ""
  jaspar_collection: CORE
  jaspar_tax_group: vertebrates
  motif_window: 200       # bp, peak-centred window for motif matching
  min_peak_fragments: 10
  background_iterations: 200
  seed: 2025
  n_top_motifs: 50

# -----------------------------------------------------------------------------
# TOBIAS footprinting
# -----------------------------------------------------------------------------
footprint:
  run: true
  # Regions for ATACorrect/ScoreBigwig/BINDetect. AS28 used stringent_union.
  peaks: stringent_union
  # Conditions footprinted and compared by BINDetect ([] = all conditions).
  conditions: []
  # JASPAR-format motif file. Empty = export JASPAR2020 CORE vertebrates.
  motifs: ""
  atacorrect_extra: ""
  scorebigwig_extra: ""
  bindetect_extra: ""

# -----------------------------------------------------------------------------
# Threads per rule family
# -----------------------------------------------------------------------------
threads:
  bowtie2_build: 4
  cutadapt: 2
  bowtie2: 4
  samtools: 2
  deeptools: 2
  featurecounts: 2
  diffbind: 2
  deseq2: 2
  chromvar: 2
  tobias: 2
  tobias_bindetect: 4
