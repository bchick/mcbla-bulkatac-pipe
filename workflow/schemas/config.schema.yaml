$schema: "https://json-schema.org/draft/2020-12/schema"
description: mcbla-bulkatac-pipe configuration
type: object
properties:
  samples: {type: string, description: samplesheet (TSV/CSV)}
  contrasts: {type: string, description: contrasts TSV (group1, group2, label)}
  input_mode: {type: string, enum: [fastq, nfcore]}
  fastq_dir: {type: string, default: ""}
  nfcore:
    type: object
    properties:
      outdir: {type: string}
      aligner: {type: string, enum: [auto, bowtie2, bwa, chromap, star], default: auto}
      use_merged_replicate: {type: boolean, default: false}
  reference:
    type: object
    properties:
      fasta: {type: string}
      bowtie2_index: {type: string, default: ""}
      gtf: {type: string, default: ""}
      blacklist: {type: string, default: ""}
      effective_genome_size: {type: integer, minimum: 1}
      macs2_gsize: {type: [string, number]}
      mito_chrom: {type: string, default: chrM}
    required: [fasta, effective_genome_size, macs2_gsize]
  exclude_conditions:
    type: array
    items: {type: string}
    default: []
  modules:
    type: object
    properties:
      qc: {type: boolean, default: true}
      multiqc: {type: boolean, default: true}
      idr: {type: boolean, default: true}
      diff: {type: boolean, default: true}
      normcheck: {type: boolean, default: true}
      timecourse: {type: boolean, default: true}
      chromvar: {type: boolean, default: true}
      footprint: {type: boolean, default: true}
  trimming:
    type: object
    properties:
      adapter_r1: {type: string}
      adapter_r2: {type: string}
      quality: {type: [string, integer]}
      min_length: {type: integer, minimum: 1}
      extra: {type: string, default: ""}
    required: [adapter_r1, adapter_r2, quality, min_length]
  align:
    type: object
    properties:
      maxins: {type: integer, minimum: 1}
      min_mapq: {type: integer, minimum: 0}
      flag_exclude: {type: integer, minimum: 0}
      bowtie2_extra: {type: string, default: ""}
      sort_mem_per_thread: {type: string, default: 768M}
    required: [maxins, min_mapq, flag_exclude]
  qc:
    type: object
    properties:
      bigwig_bin_size: {type: integer, minimum: 1}
      tss_flank: {type: integer, minimum: 1}
      summary_bin_size: {type: integer, minimum: 1}
      bamcoverage_extra: {type: string, default: ""}
    required: [bigwig_bin_size, tss_flank, summary_bin_size]
  peaks:
    type: object
    properties:
      relaxed_pvalue: {type: number, exclusiveMinimum: 0, maximum: 1}
      stringent_qvalue: {type: number, exclusiveMinimum: 0, maximum: 1}
      macs2_extra: {type: string, default: ""}
    required: [relaxed_pvalue, stringent_qvalue]
  idr:
    type: object
    properties:
      threshold: {type: number, exclusiveMinimum: 0, maximum: 1}
      rank: {type: string, enum: [p.value, q.value, signal.value], default: p.value}
      multi_rep_strategy: {type: string, enum: [encode_max_pair, first_two], default: encode_max_pair}
      single_rep_fallback: {type: string, enum: [stringent, skip], default: stringent}
      allow_failure: {type: boolean, default: true}
    required: [threshold]
  consensus:
    type: object
    properties:
      source: {type: string, enum: [idr, stringent], default: idr}
  counts:
    type: object
    properties:
      min_width: {type: integer, minimum: 1, default: 100}
      max_width: {type: integer, minimum: 1, default: 5000}
  diff:
    type: object
    properties:
      peakset: {type: string, enum: [individual, consensus], default: individual}
      min_overlap: {type: number, exclusiveMinimum: 0, default: 2}
      summits: {type: [integer, boolean, "null"], default: null}
      fdr: {type: number, exclusiveMinimum: 0, maximum: 1, default: 0.05}
      lfc: {type: number, minimum: 0, default: 1.0}
      tissue: {type: string, default: NA}
  normcheck:
    type: object
    properties:
      methods:
        type: array
        items: {type: string, enum: [csaw, quantile]}
        default: [csaw, quantile]
      sensitivity_threshold: {type: number, exclusiveMinimum: 0, default: 0.2}
      min_abs_change: {type: integer, minimum: 0, default: 10}
  timecourse:
    type: object
    properties:
      baseline_treatments: {type: array, items: {type: string}, default: []}
      min_mean_counts: {type: number, minimum: 0, default: 10}
      lrt_padj: {type: number, exclusiveMinimum: 0, maximum: 1, default: 0.01}
      vst_range: {type: number, minimum: 0, default: 0.5}
      minc: {type: integer, minimum: 1, default: 50}
      cutoff: {type: number, minimum: 0, maximum: 1, default: 0.5}
      seed: {type: integer, default: 42}
  chromvar:
    type: object
    properties:
      bsgenome: {type: string, default: ""}
      conda_env: {type: string, default: ""}
      jaspar_collection: {type: string, default: CORE}
      jaspar_tax_group: {type: string, default: vertebrates}
      motif_window: {type: integer, minimum: 1, default: 200}
      min_peak_fragments: {type: integer, minimum: 0, default: 10}
      background_iterations: {type: integer, minimum: 1, default: 200}
      seed: {type: integer, default: 2025}
      n_top_motifs: {type: integer, minimum: 1, default: 50}
  footprint:
    type: object
    properties:
      peaks: {type: string, enum: [union, consensus], default: union}
      motifs: {type: string, default: ""}
      atacorrect_extra: {type: string, default: ""}
      scorebigwig_extra: {type: string, default: ""}
      bindetect_extra: {type: string, default: ""}
  threads:
    type: object
    additionalProperties: {type: integer, minimum: 1}
required: [samples, input_mode, reference, modules, trimming, align, qc, peaks, idr,
           consensus, counts, diff, normcheck, timecourse, chromvar, footprint]
allOf:
  - if: {properties: {input_mode: {const: nfcore}}}
    then:
      properties:
        nfcore:
          required: [outdir]
          properties: {outdir: {minLength: 1}}
      required: [nfcore]
